
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch today's fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          UTC_DATE=$(date -u +%F)

          TODAY=$(python3 -c "
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('Africa/Casablanca')).strftime('%Y-%m-%d'))
          ")

          echo "UTC date: $UTC_DATE"
          echo "Morocco date: $TODAY"
          echo "Fetching fixtures for Morocco date: $TODAY"

          HTTP_CODE=$(curl -sS \
            -w "%{http_code}" \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$TODAY" \
            -o data/fixtures.json)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed"
            cat data/fixtures.json
            exit 1
          fi

          jq -e '
            (.errors | length == 0) and
            (.response | type == "array")
          ' data/fixtures.json > /dev/null || {
            echo "API returned an error:"
            jq '.errors' data/fixtures.json
            exit 1
          }

          echo "Number of matches:"
          jq '.response | length' data/fixtures.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update football fixtures"

          git push
