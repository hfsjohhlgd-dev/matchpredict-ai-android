name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data

          TODAY=$(TZ=Africa/Casablanca date +%F)
          END=$(TZ=Africa/Casablanca date -d "+7 days" +%F)

          curl -fsS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?from=$TODAY&to=$END&timezone=Africa/Casablanca" \
            -o data/fixtures.json

          jq -e '.response' data/fixtures.json > /dev/null

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "Update football fixtures"
          git push
