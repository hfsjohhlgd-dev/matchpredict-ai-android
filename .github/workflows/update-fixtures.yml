
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch weekly fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data
          echo '{"response":[],"errors":[]}' > data/fixtures.json

          for i in $(seq 0 7); do
            DAY=$(TZ=Africa/Casablanca date -d "+$i days" +%F)

            echo "Fetching fixtures for $DAY"

            curl -fsS \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DAY&timezone=Africa/Casablanca" \
              -o data/day.json

            jq -e '
              (.errors | length == 0) and
              (.response | type == "array")
            ' data/day.json > /dev/null

            jq -s '
              {
                response: (.[0].response + .[1].response),
                errors: []
              }
            ' data/fixtures.json data/day.json > data/combined.json

            mv data/combined.json data/fixtures.json
          done

          rm -f data/day.json

          echo "Total weekly matches:"
          jq '.response | length' data/fixtures.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update weekly football fixtures"

          git push
