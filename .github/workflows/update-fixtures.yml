
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch weekly fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data
          echo '{"response":[],"errors":[]}' > data/fixtures.json

          for i in $(seq 0 7); do
            DAY=$(TZ=Africa/Casablanca date -d "+$i days" +%F)

            echo "Fetching fixtures for $DAY"

            HTTP_CODE=$(curl -sS \
              -w "%{http_code}" \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/fixtures?date=$DAY&timezone=Africa/Casablanca" \
              -o data/day.json)

            echo "HTTP status for $DAY: $HTTP_CODE"
            echo "API errors:"
            jq '.errors' data/day.json

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Request failed for $DAY"
              exit 1
            fi

            if [ "$(jq '.errors | length' data/day.json)" -gt 0 ]; then
              echo "API returned an error for $DAY"
              exit 1
            fi

            if [ "$(jq -r '.response | type' data/day.json)" != "array" ]; then
              echo "Invalid response for $DAY"
              exit 1
            fi

            jq -s '
              {
                response: (.[0].response + .[1].response),
                errors: []
              }
            ' data/fixtures.json data/day.json > data/combined.json

            mv data/combined.json data/fixtures.json
          done

          rm -f data/day.json

          echo "Total weekly matches:"
          jq '.response | length' data/fixtures.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update weekly football fixtures"

          git push
