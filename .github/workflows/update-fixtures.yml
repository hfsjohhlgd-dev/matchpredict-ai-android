
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch next 48 hours
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          NOW=$(date +%s)
          LIMIT=$((NOW + 48 * 60 * 60))

          echo "Fetching next fixtures..."

          HTTP_CODE=$(curl -sS \
            -w "%{http_code}" \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?next=99&timezone=Africa/Casablanca" \
            -o data/api-response.json)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed"
            exit 1
          fi

          echo "API errors:"
          jq '.errors' data/api-response.json

          if [ "$(jq '.errors | length' data/api-response.json)" -gt 0 ]; then
            echo "API returned an error"
            exit 1
          fi

          jq --argjson now "$NOW" --argjson limit "$LIMIT" '
            {
              response: [
                .response[]
                | select(
                    .fixture.timestamp >= $now and
                    .fixture.timestamp <= $limit
                  )
              ],
              errors: []
            }
          ' data/api-response.json > data/fixtures.json

          echo "Matches in next 48 hours:"
          jq '.response | length' data/fixtures.json

          rm -f data/api-response.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update next 48 hours fixtures"

          git push
