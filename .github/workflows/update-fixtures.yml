
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch next 99 fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          if [ -z "$API_KEY" ]; then
            echo "API key is missing."
            exit 1
          fi

          echo "Fetching next 99 upcoming fixtures..."

          HTTP_CODE=$(curl -sS -G \
            -w "%{http_code}" \
            -H "x-apisports-key: $API_KEY" \
            --data-urlencode "next=99" \
            --data-urlencode "timezone=Africa/Casablanca" \
            -o data/fixtures-response.json \
            "https://v3.football.api-sports.io/fixtures")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed. Keeping previous fixtures."
            cat data/fixtures-response.json
            exit 1
          fi

          if ! jq -e '
            ((.errors // {} | length) == 0) and
            (.response | type == "array")
          ' data/fixtures-response.json > /dev/null; then

            echo "API returned an error:"
            jq '.errors' data/fixtures-response.json
            echo "Keeping previous fixtures."
            exit 1
          fi

          cp data/fixtures-response.json data/fixtures.json

          echo "Total fixtures received:"
          jq '.response | length' data/fixtures.json

          echo "Upcoming not-started fixtures:"
          jq '[
            .response[]
            | select(
                .fixture.status.short == "NS" or
                .fixture.status.short == "TBD"
              )
          ] | length' data/fixtures.json

          rm -f data/fixtures-response.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update upcoming football fixtures"

          git push
