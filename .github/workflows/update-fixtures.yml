
name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fixtures for 3 days
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          if [ -z "$API_KEY" ]; then
            echo "API key is missing."
            exit 1
          fi

          DATES=$(python3 -c "
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo('Africa/Casablanca')).date()
          end = today + timedelta(days=2)

          print(today.strftime('%Y-%m-%d'))
          print(end.strftime('%Y-%m-%d'))
          ")

          TODAY=$(echo "$DATES" | sed -n '1p')
          END_DATE=$(echo "$DATES" | sed -n '2p')

          echo "Morocco start date: $TODAY"
          echo "Morocco end date: $END_DATE"
          echo "Fetching fixtures..."

          HTTP_CODE=$(curl -sS \
            -w "%{http_code}" \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?from=$TODAY&to=$END_DATE&timezone=Africa%2FCasablanca" \
            -o data/fixtures-response.json)

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "API request failed. Keeping previous fixtures."
            cat data/fixtures-response.json
            exit 1
          fi

          if ! jq -e '
            ((.errors // {} | length) == 0) and
            (.response | type == "array")
          ' data/fixtures-response.json > /dev/null; then

            echo "API returned an error:"
            jq '.errors' data/fixtures-response.json

            if jq -e '.errors.requests != null' data/fixtures-response.json > /dev/null; then
              echo "Daily API request limit reached. Keeping previous fixtures."
              exit 0
            fi

            exit 1
          fi

          cp data/fixtures-response.json data/fixtures.json

          echo "Total fixtures received:"
          jq '.response | length' data/fixtures.json

          echo "Upcoming not-started fixtures:"
          jq '[
            .response[]
            | select(
                .fixture.status.short == "NS" or
                .fixture.status.short == "TBD"
              )
          ] | length' data/fixtures.json

          rm -f data/fixtures-response.json

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          git diff --cached --quiet || git commit -m "Update football fixtures"

          git push
