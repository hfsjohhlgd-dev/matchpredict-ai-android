name: Update Football Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch fixtures
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          TODAY=$(TZ=Africa/Casablanca date +%F)
          END=$(TZ=Africa/Casablanca date -d "+7 days" +%F)

          echo "Fetching fixtures from $TODAY to $END"

          curl -sS \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?from=$TODAY&to=$END&timezone=Africa/Casablanca" \
            -o data/fixtures.json

          echo "API errors:"
          jq '.errors' data/fixtures.json

          echo "Response type:"
          jq '.response | type' data/fixtures.json

          echo "Number of matches:"
          jq '.response | length' data/fixtures.json

          if [ "$(jq -r '.response | type' data/fixtures.json)" != "array" ]; then
            echo "ERROR: API did not return a fixtures array."
            exit 1
          fi

          if [ "$(jq '.errors | length' data/fixtures.json)" -gt 0 ]; then
            echo "ERROR: API returned an error."
            exit 1
          fi

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "Update weekly football fixtures"
          git push
