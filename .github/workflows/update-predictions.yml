name: Update AI Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch predictions for top leagues
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          NOW=$(date +%s)

          echo "Preparing top league predictions..."

          if [ ! -f data/fixtures.json ]; then
            echo "Fixtures file not found."
            exit 1
          fi

          echo "Total fixtures:"
          jq '.response | length' data/fixtures.json

          echo "Selecting matches from top 5 leagues..."

          jq --argjson now "$NOW" -r '
            [
              .response[]
              | select((.fixture.timestamp // 0) > $now)
              | select(.fixture.id != null)
              | select(.league.id as $id |
                  [39, 140, 135, 78, 61] | index($id) != null
                )
              | {
                  id: .fixture.id,
                  league_id: .league.id,
                  league_name: .league.name,
                  timestamp: .fixture.timestamp
                }
            ]
            | unique_by(.id)
            | sort_by([
                ([39, 140, 135, 78, 61] | index(.league_id)),
                .timestamp
              ])
            | .[:5][]
            | .id
          ' data/fixtures.json > data/fixture_ids.txt

          echo "Selected matches:"
          wc -l < data/fixture_ids.txt

          if [ ! -s data/fixture_ids.txt ]; then
            echo "No upcoming matches in the selected leagues."
            exit 0
          fi

          echo '{"updated_at":"","response":[]}' > data/predictions-new.json

          NEW_COUNT=0

          while read -r FIXTURE_ID; do
            [ -z "$FIXTURE_ID" ] && continue

            echo "Analyzing fixture: $FIXTURE_ID"

            HTTP_CODE=$(curl -sS \
              -w "%{http_code}" \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/predictions?fixture=$FIXTURE_ID" \
              -o data/prediction-response.json)

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Request failed. Stopping."
              break
            fi

            if ! jq -e '
              (.errors // {} | length == 0) and
              (.response | type == "array")
            ' data/prediction-response.json > /dev/null; then

              echo "API error:"
              jq '.errors' data/prediction-response.json

              if jq -e '
                ((.errors.requests // "") | tostring |
                test("request limit|limit for the day"; "i"))
              ' data/prediction-response.json > /dev/null; then
                echo "Daily request limit reached. Stopping immediately."
                break
              fi

              echo "Skipping this fixture."
              sleep 6
              continue
            fi

            COUNT=$(jq '.response | length' data/prediction-response.json)

            echo "Predictions returned: $COUNT"

            if [ "$COUNT" -gt 0 ]; then
              jq --argjson id "$FIXTURE_ID" \
                --slurpfile item data/prediction-response.json '
                .response += [{
                  fixture_id: $id,
                  prediction: $item[0].response[0]
                }]
              ' data/predictions-new.json > data/temp.json

              mv data/temp.json data/predictions-new.json

              NEW_COUNT=$((NEW_COUNT + 1))
            fi

            sleep 6
          done < data/fixture_ids.txt

          echo "New predictions collected: $NEW_COUNT"

          if [ "$NEW_COUNT" -gt 0 ]; then
            jq --arg time "$(date -u +%FT%TZ)" \
              '.updated_at = $time' \
              data/predictions-new.json > data/temp.json

            mv data/temp.json data/predictions-new.json
            mv data/predictions-new.json data/predictions.json

            echo "Predictions saved successfully."
          else
            echo "No new predictions. Keeping previous predictions."
          fi

          rm -f data/fixture_ids.txt
          rm -f data/prediction-response.json
          rm -f data/predictions-new.json
          rm -f data/temp.json

          echo "Final predictions:"
          jq '.response | length' data/predictions.json

      - name: Save predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/predictions.json

          git diff --cached --quiet || git commit -m "Update top league predictions"

          git push
