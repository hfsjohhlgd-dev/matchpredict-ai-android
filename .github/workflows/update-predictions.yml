
name: Update AI Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch predictions
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          NOW=$(date +%s)

          echo "Preparing predictions..."

          echo '{"updated_at":"","response":[]}' > data/predictions.json

          echo "Total fixtures in file:"
          jq '.response | length' data/fixtures.json

          echo "Future fixtures:"
          jq --argjson now "$NOW" '
            [.response[] | select((.fixture.timestamp // 0) > $now)]
            | length
          ' data/fixtures.json

          jq --argjson now "$NOW" -r '
            [
              .response[]
              | select((.fixture.timestamp // 0) > $now)
            ]
            | sort_by(.fixture.timestamp)
            | unique_by(.fixture.id)
            | .[:50][]
            | .fixture.id
          ' data/fixtures.json > data/fixture_ids.txt

          echo "Fixtures selected:"
          wc -l < data/fixture_ids.txt

          while read -r FIXTURE_ID; do
            [ -z "$FIXTURE_ID" ] && continue

            echo "Analyzing fixture: $FIXTURE_ID"

            HTTP_CODE=$(curl -sS \
              -w "%{http_code}" \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/predictions?fixture=$FIXTURE_ID" \
              -o data/prediction-response.json)

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Request failed for fixture $FIXTURE_ID"
              sleep 6
              continue
            fi

            if ! jq -e '(.errors | length == 0)' data/prediction-response.json > /dev/null; then
              echo "API error:"
              jq '.errors' data/prediction-response.json
              sleep 6
              continue
            fi

            COUNT=$(jq '.response | length' data/prediction-response.json)

            echo "Predictions returned: $COUNT"

            if [ "$COUNT" -gt 0 ]; then
              jq --argjson id "$FIXTURE_ID" \
                --slurpfile item data/prediction-response.json '
                .response += [{
                  fixture_id: $id,
                  prediction: $item[0].response[0]
                }]
              ' data/predictions.json > data/temp.json

              mv data/temp.json data/predictions.json
            fi

            sleep 6
          done < data/fixture_ids.txt

          jq --arg time "$(date -u +%FT%TZ)" \
            '.updated_at = $time' \
            data/predictions.json > data/temp.json

          mv data/temp.json data/predictions.json

          echo "Total predictions:"
          jq '.response | length' data/predictions.json

          rm -f data/fixture_ids.txt data/prediction-response.json

      - name: Save predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/predictions.json

          git diff --cached --quiet || git commit -m "Update AI predictions"

          git push
