name: Update AI Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze up to 20 upcoming matches
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          set -e
          mkdir -p data

          if [ -z "$API_KEY" ]; then
            echo "API key is missing."
            exit 1
          fi

          if [ ! -f data/fixtures.json ]; then
            echo "Fixtures file not found."
            exit 1
          fi

          NOW=$(date +%s)

          jq --argjson now "$NOW" '
            [
              .response[]
              | select((.fixture.timestamp // 0) > $now)
              | select(
                  .fixture.status.short == "NS" or
                  .fixture.status.short == "TBD"
                )
              | select(.fixture.id != null)
              | {
                  id: .fixture.id,
                  timestamp: .fixture.timestamp,
                  date: .fixture.date,
                  league: .league.name,
                  country: .league.country,
                  home: .teams.home.name,
                  away: .teams.away.name
                }
            ]
            | unique_by(.id)
            | sort_by(.timestamp)
            | .[:20]
          ' data/fixtures.json > data/candidates.json

          TOTAL=$(jq 'length' data/candidates.json)
          echo "Selected matches: $TOTAL"

          echo '{"response":[]}' > data/raw-predictions.json

          FAILED=0

          while IFS= read -r MATCH; do
            ID=$(echo "$MATCH" | jq -r '.id')

            echo "Analyzing: $ID"

            HTTP_CODE=$(curl -sS \
              -w "%{http_code}" \
              -H "x-apisports-key: $API_KEY" \
              "https://v3.football.api-sports.io/predictions?fixture=$ID" \
              -o data/prediction-response.json)

            if [ "$HTTP_CODE" != "200" ]; then
              echo "HTTP error: $HTTP_CODE"
              FAILED=1
              break
            fi

            if ! jq -e '
              ((.errors // {} | length) == 0) and
              (.response | type == "array")
            ' data/prediction-response.json > /dev/null; then
              echo "API error:"
              jq '.errors' data/prediction-response.json
              FAILED=1
              break
            fi

            COUNT=$(jq '.response | length' data/prediction-response.json)

            if [ "$COUNT" -gt 0 ]; then
              jq --argjson match "$MATCH" \
                --slurpfile result data/prediction-response.json '
                .response += [{
                  fixture: $match,
                  prediction: $result[0].response[0]
                }]
              ' data/raw-predictions.json > data/temp.json

              mv data/temp.json data/raw-predictions.json
            fi

            sleep 6

          done < <(jq -c '.[]' data/candidates.json)

          if [ "$FAILED" -ne 0 ]; then
            echo "Analysis incomplete. Clearing old selections."
            echo '{"response":[]}' > data/raw-predictions.json
          fi

          python3 <<'PY'
          import json
          import math
          from datetime import datetime, timezone

          with open("data/raw-predictions.json", encoding="utf-8") as f:
              raw = json.load(f)

          selected = []

          def number(value):
              try:
                  if value is None or value == "-":
                      return None
                  return float(value)
              except (ValueError, TypeError):
                  return None

          for item in raw["response"]:
              match = item["fixture"]
              prediction = item["prediction"]

              goals = prediction.get("predictions", {}).get("goals", {})

              home_goals = number(goals.get("home"))
              away_goals = number(goals.get("away"))

              if home_goals is None or away_goals is None:
                  continue

              if home_goals < 0 or away_goals < 0:
                  continue

              total = home_goals + away_goals

              probability = 1 - sum(
                  math.exp(-total) * total**k / math.factorial(k)
                  for k in range(4)
              )

              probability = max(0.0, min(1.0, probability))

              if probability < 0.70:
                  continue

              selected.append({
                  "fixture_id": match["id"],
                  "date": match["date"],
                  "timestamp": match["timestamp"],
                  "league": match["league"],
                  "country": match["country"],
                  "home": match["home"],
                  "away": match["away"],
                  "expected_home_goals": home_goals,
                  "expected_away_goals": away_goals,
                  "expected_total_goals": round(total, 2),
                  "probability_over_3_5": round(probability * 100, 1),
                  "market": "Over 3.5"
              })

          selected.sort(
              key=lambda x: x["probability_over_3_5"],
              reverse=True
          )

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "market": "Over 3.5",
              "minimum_probability": 70,
              "method": "Heuristic Poisson estimate, not calibrated",
              "response": selected[:5]
          }

          with open("data/predictions.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Qualified matches:", len(output["response"]))

          for match in output["response"]:
              print(
                  match["home"], "vs", match["away"],
                  "-", match["probability_over_3_5"], "%"
              )
          PY

      - name: Save predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/predictions.json

          git diff --cached --quiet || git commit -m "Update Over 3.5 goal selections"

          git push
